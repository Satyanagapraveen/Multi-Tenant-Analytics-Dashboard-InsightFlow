services:
  db:
    image: postgres:15
    environment:
     POSTGRES_DB: insightflow
     POSTGRES_USER: postgres
     POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresqldata
    ports:
      - "5432:5432"
  backend:
   build : .
   command : python manage.py runserver 0.0.0:8000
   volumes:
     - .:/app
   ports:
      - "8000:8000"
   depends_on:
    - db
volumes:
  postgres_data:


